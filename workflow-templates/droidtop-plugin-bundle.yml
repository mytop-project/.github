name: Plugin bundle

# Build, signing and the tag release live once, in mytop-project/droidtop-platforms, pinned by commit. The build job never
# holds the signing key; the sign job runs this repository's sign.sh with PLUGIN_SIGNING_KEY and, when present,
# PLUGIN_SIGNING_CERT. A tag named plugin-v* attaches the signed bundle to that release. Set artifact-name to
# droidtop-plugin-<your plugin>.
on:
  push:
    branches: [$default-branch]
    tags: ['plugin-v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bundle:
    permissions:
      contents: write
    uses: mytop-project/droidtop-platforms/.github/workflows/droidtop-plugin-bundle.yml@1efbb7df7626174a7146e767dda52bb1a9b6cc98
    with:
      plugin-dir: .
      artifact-name: droidtop-plugin-name
    secrets:
      PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
      PLUGIN_SIGNING_CERT: ${{ secrets.PLUGIN_SIGNING_CERT }}
